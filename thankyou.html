<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You for Your Purchase - NexusAI Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-gray-800 p-8 rounded-2xl border border-gray-700 text-center shadow-2xl">
        <div class="w-16 h-16 bg-green-500 text-white rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold">
            ✓
        </div>
        <h1 class="text-2xl font-bold mb-2">Thank You for Your Order!</h1>
        <p class="text-gray-400 text-sm mb-4">
            Your purchase was successful. Your Pro access has been automatically activated in this browser!
        </p>

        <!-- Access Status Box -->
        <div class="bg-gray-900 border border-green-500/40 rounded-xl p-3 mb-6 text-left">
            <div class="text-xs text-gray-400">Account Status:</div>
            <div class="text-green-400 font-bold text-sm flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-400 inline-block animate-pulse"></span> 
                NexusAI Pro Lifetime Activated
            </div>
            <div class="text-xs text-gray-400 mt-2">Access Key:</div>
            <div class="text-xs font-mono text-gray-300 bg-gray-800 p-1 rounded mt-1 overflow-x-auto" id="license-key">
                NXPRO-UNLOCKING...
            </div>
        </div>

        <!-- Product Access Button -->
        <a href="index.html" class="block w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl transition duration-200 mb-4 shadow-lg">
            Launch NexusAI Pro Dashboard 🚀
        </a>

        <!-- Support Hub Section -->
        <div class="text-xs text-gray-400 mt-6 border-t border-gray-700 pt-4">
            Need help or have questions? Visit our 
            <a href="https://nexusai-support-hub.vercel.app/" target="_blank" class="text-blue-400 font-semibold underline hover:text-blue-300">
                NexusAI Support Hub
            </a>
        </div>
    </div>

    <!-- Automatic Pro Access Unlock Script -->
    <script>
        // 1. Activate Pro Access in LocalStorage
        localStorage.setItem('nexus_pro_access', 'true');
        localStorage.setItem('nexus_user_tier', 'PRO');

        // 2. Generate a Unique Display Key for the User
        const randomKey = 'NXPRO-' + Math.random().toString(36).substring(2, 10).toUpperCase() + '-ACTIVE';
        document.getElementById('license-key').innerText = randomKey;
    </script>

</body>
</html>
